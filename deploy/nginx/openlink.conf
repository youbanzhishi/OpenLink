# ============================================================================
# OpenLink Nginx Configuration
#
# Features:
#   - SSL termination
#   - Rate limiting (general + API + auth)
#   - WebSocket upgrade support
#   - Gzip compression
#   - Upstream load balancing (2 replicas)
#   - Security headers
# ============================================================================

# Upstream: OpenLink API replicas
upstream openlink_api {
    least_conn;
    server openlink-api:3000 max_fails=3 fail_timeout=30s;
    # Docker Compose deploy.replicas will resolve to multiple containers
    # under the same service name, so DNS-based round-robin is used.
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # --- SSL Configuration ---
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security Headers ---
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Gzip Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    # --- Health check endpoint ---
    location /health {
        proxy_pass http://openlink_api/health;
        access_log off;
    }

    # --- API endpoints ---
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://openlink_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request size limit
        client_max_body_size 50m;
    }

    # --- Authentication endpoints (stricter rate limit) ---
    location ~ ^/api/v1/(auth|login|register) {
        limit_req zone=auth burst=3 nodelay;

        proxy_pass http://openlink_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket endpoint ---
    location /ws/ {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://openlink_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Metrics (internal only, for Prometheus) ---
    location /metrics {
        # Allow access from internal network only
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://openlink_api/metrics;
    }

    # --- Default: general rate limit ---
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://openlink_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
