[package]
name = "openlink-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "openlink-api"
path = "src/main.rs"

[dependencies]
openlink-core = { path = "../openlink-core" }
openlink-store = { path = "../openlink-store" }
openlink-cache = { path = "../openlink-cache" }
ext-knowledge-join = { path = "../../extensions/ext-knowledge-join" }
# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
# Serialization
ext-redirect = { path = "../../extensions/ext-redirect" }
ext-webhook = { path = "../../extensions/ext-webhook" }
ext-conditions = { path = "../../extensions/ext-conditions" }
ext-hooks = { path = "../../extensions/ext-hooks" }
ext-json = { path = "../../extensions/ext-json" }

serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Config
toml = { workspace = true }

# Random
rand = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Phase 5: Monitoring
prometheus = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Phase 8: URL encoding for share deeplinks
urlencoding = { workspace = true }

# Phase 3.5: QR Code generation for Identity Card
qrcode = "0.14"

[dev-dependencies]
tokio-test = "0.4"
