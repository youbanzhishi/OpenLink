[workspace]
members = [
    "crates/openlink-core",
    "crates/openlink-store",
    "crates/openlink-api",
    "crates/openlink-edge",
    "crates/openlink-sdk",
    "crates/openlink-node",
    "extensions/ext-redirect",
    "extensions/ext-webhook",
    "extensions/ext-conditions",
    "extensions/ext-hooks",
    "extensions/ext-json",
    "extensions/ext-workflow",
    "extensions/ext-filetransfer",
    "extensions/ext-direct-transfer",
    "extensions/ext-daw-distribute",
    "extensions/ext-knowledge-join",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros"] }

# Config
toml = "0.8"

# Random — short code generation
rand = "0.8"

# HTTP client (webhook)
reqwest = { version = "0.12", features = ["json"] }

# Cryptography (for R2 signing)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Phase 4: LAN discovery & file transfer
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
warp = "0.3"            # Lightweight HTTP server for node file service
bytes = "1"

# Phase 4: URL encoding for DAW deeplinks
urlencoding = "2"
hostname = "0.4"
