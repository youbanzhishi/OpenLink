[workspace]
members = [
    "crates/openlink-core",
    "crates/openlink-store",
    "crates/openlink-api",
    "crates/openlink-edge",
    "crates/openlink-sdk",
    "crates/openlink-node",
    "crates/openlink-cache",
    "crates/openlink-a2a",
    "crates/openlink-orchestrator",
    "extensions/ext-redirect",
    "extensions/ext-webhook",
    "extensions/ext-conditions",
    "extensions/ext-hooks",
    "extensions/ext-json",
    "extensions/ext-workflow",
    "extensions/ext-filetransfer",
    "extensions/ext-direct-transfer",
    "extensions/ext-daw-distribute",
    "extensions/ext-p2p-transfer",
    "extensions/ext-a2a-discovery",
    "extensions/ext-orchestrator",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID (pinned to avoid getrandom 0.4 which requires edition2024)
uuid = { version = "1.6", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros"] }

# Config
toml = "0.8"

# Random — short code generation
rand = "0.8"

# HTTP client (webhook)
reqwest = { version = "0.12", features = ["json"] }

# Cryptography (for R2/OSS signing)
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"

# Phase 4: LAN discovery & file transfer
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
warp = "0.3"
bytes = "1"

# Phase 4: URL encoding for DAW deeplinks
urlencoding = "2"
hostname = "0.4"

# Phase 5: Monitoring
prometheus = "0.13"

# Phase 5: LRU Cache
lru = "0.12"

# Phase 7: Monitoring & Security
parking_lot = "0.12"
url = "2"

# Phase 8: Base64 encoding (OSS/WebDAV auth)

# Phase 8: SFTP support
ssh2 = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
