# OpenLink 单容器部署
version: "3.8"

services:
  openlink:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openlink
    ports:
      - "3000:3000"
    volumes:
      - openlink-data:/app/data
      - ../config:/app/config:ro
    environment:
      - RUST_LOG=openlink=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/links"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  openlink-data:
    driver: local
