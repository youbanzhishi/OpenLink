# OpenLink 默认配置
# 优先级：环境变量 > 配置文件 > 默认值
# Phase 2: 新增 auth 配置
# Phase 3: 新增 knowledge 配置（知识体系一键接入）

[server]
host = "0.0.0.0"
port = 3000

[store]
backend = "sqlite"       # 初期用 SQLite，后期可切 PG
path = "./data/openlink.db"

[shortcode]
length = 6               # 6 位 Base62 = 568 亿组合
charset = "base62"

# Phase 2: API Token 认证配置
# enabled = true 时，管理API不需要认证
# enabled = true 时，管理API需要 Bearer Token
[auth]
enabled = true

# Token 列表（enabled = true 时生效）
# [[auth.tokens]]
# token = "ol-admin-secret-2026"
# name = "admin"
# scopes = ["read", "write", "admin"]
#
# [[auth.tokens]]
# token = "ol-readonly-key"
# name = "viewer"
# scopes = ["read"]

# Phase 3: 知识体系配置
# enabled = true 时启用知识体系 API
# repo_path = 知识体系仓库的本地路径（需要先 clone 到本地）
# invite_codes = MVP 阶段的写死邀请码列表
[knowledge]
enabled = true
repo_path = "/app/data/所有对话/主对话/open-knowledge-system"
base_url = "http://localhost:3000"

# MVP 邀请码列表（实际使用时替换为真实邀请码）
invite_codes = ["openclaw-2026", "welcome-agent", "knowledge-join"]
