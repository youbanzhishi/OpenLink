# OpenLink 默认配置
# 优先级：环境变量 > 配置文件 > 默认值
# Phase 2: 新增 auth 配置
# Phase 3: 新增 knowledge 配置（知识体系一键接入，支持多源）

[server]
host = "0.0.0.0"
port = 3000

[store]
backend = "sqlite"       # 初期用 SQLite，后期可切 PG
path = "./data/openlink.db"

[shortcode]
length = 6               # 6 位 Base62 = 568 亿组合
charset = "base62"

# Phase 2: API Token 认证配置
[auth]
enabled = true

# Phase 3: 知识体系配置（多源版）
# base_url = API 对外地址，用于生成资源 URL
# sources = 知识源列表，每个源有独立的仓库路径和邀请码
[knowledge]
enabled = true
base_url = "http://localhost:3000"

# 知识源1：私有（完整知识体系，自己用）
[[knowledge.sources]]
name = "private"
display_name = "OpenClaw知识体系"
short_code = "0"
repo_path = "/app/data/所有对话/主对话/open-knowledge-system"
invite_codes = ["openclaw-2026", "welcome-agent", "knowledge-join"]
sync_token = "ol-sync-dev-2026"

# 知识源2：公开（框架版，给别人用）
[[knowledge.sources]]
name = "public"
display_name = "OpenClaw Framework"
short_code = "1"
repo_path = "/app/data/所有对话/主对话/open-knowledge-framework"
invite_codes = ["openclaw-framework", "try-openclaw"]
sync_token = ""
