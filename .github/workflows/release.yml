name: Release
on:
  push:
    tags:
      - 'v*'
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
permissions:
  contents: write
  packages: write
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: openlink-linux-amd64
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: openlink-macos-amd64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: openlink-macos-arm64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: openlink-windows-amd64.exe
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Build
        run: cargo build --release -p openlink-api --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz openlink-api${{ matrix.ext }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/openlink-api${{ matrix.ext }}" -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/openlink-linux-amd64/openlink-linux-amd64.tar.gz
            artifacts/openlink-macos-amd64/openlink-macos-amd64.tar.gz
            artifacts/openlink-macos-arm64/openlink-macos-arm64.tar.gz
            artifacts/openlink-windows-amd64.exe/openlink-windows-amd64.exe.zip
          generate_release_notes: true
