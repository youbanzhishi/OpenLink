# ============================================================================
# release.yml - Rust 项目自动 Release 工作流
#
# 用途：tag v* 触发 → 构建 release 二进制 → 创建 GitHub Release
# 适用项目：OpenLink / OpenVault / OpenDAW 等 Rust 项目
#
# 使用方式：
#   1. 复制此文件到 <项目根目录>/.github/workflows/release.yml
#   2. 根据项目修改 env 部分的变量（BINARY_NAME 等）
#   3. 打 tag 触发: git tag v0.1.0 && git push --tags
#
# 产物：
#   - Linux x86_64 (gnu)
#   - macOS x86_64 + aarch64 (Apple Silicon)
#   - Windows x86_64
# ============================================================================

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # ---- 项目特定变量（复制后修改） ----
  BINARY_NAME: openlink
  RUST_TOOLCHAIN: stable

jobs:
  # ========== 构建 Release 二进制 ==========
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ${{ env.BINARY_NAME }}
            asset_name: ${{ env.BINARY_NAME }}-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ${{ env.BINARY_NAME }}
            asset_name: ${{ env.BINARY_NAME }}-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ${{ env.BINARY_NAME }}
            asset_name: ${{ env.BINARY_NAME }}-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ${{ env.BINARY_NAME }}.exe
            asset_name: ${{ env.BINARY_NAME }}-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip

  # ========== 创建 GitHub Release ==========
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
