# ============================================================================
# ci.yml - Rust 项目通用 CI 工作流
#
# 用途：PR/push 自动检查 — check + clippy + test + fmt
# 适用项目：OpenLink / OpenVault / OpenDAW 等 Rust 项目
#
# 使用方式：
#   1. 复制此文件到 <项目根目录>/.github/workflows/ci.yml
#   2. 根据项目修改 env 部分的变量
#
# 关键优化：
#   - Swatinem/rust-cache: 缓存依赖+编译产物，后续构建秒级
#   - 分步执行: check → clippy → test → fmt，前一步的缓存给后一步用
#   - CARGO_INCREMENTAL: 增量编译，改一个文件不全量重编
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  # ---- 项目特定变量（复制后修改） ----
  RUST_TOOLCHAIN: stable

jobs:
  # ========== 快速检查 ==========
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cargo check
        run: cargo check --all-targets

  # ========== Lint ==========
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ========== 测试 ==========
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-targets

      # 如果安装了 nextest（更快），取消注释下行并注释上面 cargo test
      # - name: Install nextest
      #   uses: taiki-e/install-action@nextest
      # - name: Run tests with nextest
      #   run: cargo nextest run --all-targets

  # ========== 格式检查 ==========
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
