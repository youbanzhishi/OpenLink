# ============================================================================
# ci.yml - OpenLink CI 工作流 (Phase 11 — Production Grade)
#
# 流水线:
#   1. cargo check (openlink-core/api/sdk/a2a)
#   2. cargo test (openlink-core only — 轻量快速)
#   3. cargo clippy + cargo fmt --check
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  RUST_TOOLCHAIN: stable

jobs:
  # ========== Cargo Check ==========
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cargo check (core + api + sdk + a2a)
        run: cargo check -p openlink-core -p openlink-api -p openlink-sdk -p openlink-a2a

  # ========== Tests (openlink-core only — lightweight) ==========
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests (openlink-core only)
        run: cargo test -p openlink-core --all-targets

  # ========== Clippy ==========
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy (core + api + sdk + a2a)
        run: cargo clippy -p openlink-core -p openlink-api -p openlink-sdk -p openlink-a2a -- -D warnings

  # ========== Formatting ==========
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
